name: Publish Playground to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'playground/**'
      - 'src/playground/**'
      - 'scripts/assemble-playground-site.cjs'
      - 'scripts/test-playground-e2e.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages-playground.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Composer
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Playground test dependencies
        run: npm ci
      - name: Install Chromium for Playground E2E
        run: npx playwright install --with-deps chromium
      - name: Checkout Acorde
        uses: actions/checkout@v4
        with:
          repository: kent-tokyo/acorde
          path: acorde
          ref: v1.2.2
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - name: Build Acorde WASM and assemble site
        run: |
          wasm-pack build acorde/crates/wasm --target web --out-dir "$GITHUB_WORKSPACE/src/playground/acorde-wasm" --release --no-typescript
          rm -f src/playground/acorde-wasm/.gitignore
          npm run assemble:playground
      - name: Run Playground browser E2E
        run: npm run test:playground
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
